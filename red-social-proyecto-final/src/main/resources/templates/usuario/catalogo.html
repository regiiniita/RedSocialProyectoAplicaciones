<th:block th:replace="~{usuario/contenido :: layout(~{::title}, ~{::main}, 'catalogo')}">
  <title>The Spot - Catálogo</title>

  <main class="contenedor-catalogo">
    <section class="seccion-busqueda">
      <h1 class="busqueda-titulo">Encuentra tu próximo lugar favorito</h1>

      <!-- El formulario conserva los filtros al volver a cargar la página. -->
      <form th:action="@{/api/lugares}" method="get" class="busqueda-form">
        <input type="hidden" name="vista" value="catalogo">

        <input type="search" name="query" class="busqueda-campo" maxlength="100"
               th:value="${filtro.query}" placeholder="Buscar lugar" aria-label="Buscar lugar">

        <select name="categoria" class="select-ordenar" aria-label="Categoría">
          <option value="">Todas las categorías</option>
          <option th:each="opcion : ${categorias}"
                  th:value="${opcion.nombre}" th:text="${opcion.nombre}"
                  th:selected="${opcion.nombre == filtro.categoria}"></option>
        </select>

        <select name="orden" class="select-ordenar" aria-label="Orden de los lugares">
          <option value="recientes" th:selected="${filtro.orden == 'recientes'}">Más recientes</option>
          <option value="mejor_valorado" th:selected="${filtro.orden == 'mejor_valorado'}">Mejor valorado</option>
          <option value="mas_resenados" th:selected="${filtro.orden == 'mas_resenados'}">Más reseñados</option>
        </select>

        <button type="submit" class="btn btn--primario">Aplicar</button>
      </form>
      <p th:if="${errorCatalogo}" th:text="${errorCatalogo}" role="alert"></p>
    </section>

    <hr class="separador-catalogo">

    <section class="seccion-lugares">
      <div class="lugares-header">
        <h2 class="lugares-subtitulo">Lugares Destacados</h2>
      </div>

      <p th:if="${errorCatalogo == null and #lists.isEmpty(lugares)}">No se encontraron lugares.</p>

      <div class="grid-catalogo">
        <article class="tarjeta-catalogo" th:each="lugar : ${lugares}">
          <!-- La foto usa la ruta que se guardó con el lugar. -->
          <div class="tarjeta-catalogo__media" th:if="${lugar.imagen != null and !lugar.imagen.isBlank()}">
            <img th:src="@{${lugar.imagen}}" th:alt="${lugar.nombre}" class="tarjeta-catalogo__img">
          </div>
          <div class="tarjeta-catalogo__body">
            <span class="tarjeta-catalogo__categoria" th:text="${lugar.categoria.nombre}"></span>
            <h3 class="tarjeta-catalogo__titulo" th:text="${lugar.nombre}"></h3>
            <div class="tarjeta-catalogo__ubicacion" th:text="${lugar.direccion}"></div>
            <div class="tarjeta-catalogo__footer">
              <div class="calificacion-box">
                <span class="estrella-icono" aria-hidden="true">★</span>
                <strong th:text="${#numbers.formatDecimal(lugar.promedio, 1, 1)}"></strong>
              </div>
              <span class="resenas-conteo" th:text="|${lugar.totalResenas} reseñas|"></span>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>
</th:block>
