<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <body>
        <!-- Elementos de presentación que se repiten en las pantallas administrativas. -->
        <div class="encabezado-pagina__texto" th:fragment="titulo(titulo, subtitulo, id)">
            <h1 class="encabezado-pagina__titulo" th:id="${id}" th:text="${titulo}"></h1>
            <p class="encabezado-pagina__subtitulo" th:text="${subtitulo}"></p>
        </div>

        <th:block th:fragment="mensajes">
            <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
            <p th:if="${error}" th:text="${error}" class="texto-error" role="alert"></p>
        </th:block>

        <tr th:fragment="vacio(registros, columnas, mensaje)" th:if="${#lists.isEmpty(registros)}">
            <td th:colspan="${columnas}" th:text="${mensaje}"></td>
        </tr>

        <!-- La paginación permanece deshabilitada mientras no exista una consulta por páginas. -->
        <nav class="paginacion" th:fragment="paginacion(etiqueta)" th:aria-label="${etiqueta}">
            <button class="paginacion__enlace" type="button" aria-label="Página anterior" disabled>&lsaquo;</button>
            <button class="paginacion__enlace" type="button" aria-label="Página siguiente" disabled>&rsaquo;</button>
        </nav>

        <span class="estrellas" role="img" th:fragment="estrellas(calificacion, mostrarNumero)"
            th:aria-label="|${calificacion} de 5 estrellas|">
            <i th:each="estrella : ${#numbers.sequence(1, 5)}" class="bi bi-star-fill estrella"
                th:classappend="${estrella &lt;= calificacion} ? 'estrella--llena' : 'estrella--vacia'"
                aria-hidden="true"></i>
            <span th:if="${mostrarNumero}" th:text="${calificacion}"></span>
        </span>

        <div class="modal__header" th:fragment="cabeceraModal(titulo, subtitulo)">
            <div>
                <h2 class="modal__titulo" th:text="${titulo}"></h2>
                <p class="modal__subtitulo" th:text="${subtitulo}"></p>
            </div>
            <a href="#" class="modal__cerrar" aria-label="Cerrar modal">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </a>
        </div>

        <!-- Los formularios de los módulos pendientes solo conservan su presentación. -->
        <div class="modal__footer" th:fragment="guardarMuestra">
            <a href="#" class="modal__btn-texto">Cancelar</a>
            <button type="button" class="btn btn--primario">Guardar</button>
        </div>

        <div class="modal-alerta__contenido" th:fragment="contenidoConfirmacion(titulo, texto, advertencia)">
            <i class="bi bi-exclamation-circle-fill modal-alerta__icono" aria-hidden="true"></i>
            <h2 class="modal-alerta__titulo" th:text="${titulo}"></h2>
            <p class="modal-alerta__texto" th:if="${texto != null}" th:text="${texto}"></p>
            <p class="modal-alerta__advertencia" th:if="${advertencia != null}" th:text="${advertencia}"></p>
        </div>
    </body>
</html>
