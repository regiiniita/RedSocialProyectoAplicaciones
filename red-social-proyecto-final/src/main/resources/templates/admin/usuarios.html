<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/admin :: layout('Gestión de usuarios', 'usuarios', ~{::main})}">
    <body>

        <main class="contenido-admin">
            <div class="encabezado-pagina">
                <div th:replace="~{fragments/admin/componentes :: titulo('Gestión de Usuarios', 'Consulta la actividad y administra el acceso de las cuentas.', null)}"></div>
            </div>

            <th:block th:replace="~{fragments/admin/componentes :: mensajes}"></th:block>
            <section class="tabla-tarjeta">
                <!-- La búsqueda se envía por GET para conservar el filtro en la dirección. -->
                <form class="tabla-herramientas" th:action="@{/admin/usuarios}" method="get">
                    <label class="buscador">
                        <i class="bi bi-search buscador__icono" aria-hidden="true"></i>

                        <input class="buscador__campo" type="search" name="buscar" th:value="${buscar}" placeholder="Buscar por usuario o email..." aria-label="Buscar usuarios">
                    </label>
                    <button class="btn btn--primario btn--pequeno" type="submit">Buscar</button>
                    <a class="btn btn--cancelar btn--pequeno" th:href="@{/admin/usuarios}">Limpiar</a>
                </form>

                <div class="tabla-scroll">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th scope="col">USUARIO</th>
                                <th scope="col">EMAIL</th>
                                <th scope="col">TOTAL RESEÑAS</th>
                                <th scope="col">ESTADO</th>
                                <th scope="col">ACCIÓN</th>
                            </tr>
                        </thead>
                        <!-- Thymeleaf genera una fila por cada registro recibido desde Java. -->
                        <tbody>

                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="|@${usuario.username}|"></td>
                                <td th:text="${usuario.email}"></td>
                                <td th:text="${usuario.totalResenas}"></td>
                                <td th:text="${usuario.estado}"></td>
                                <td>
                                    <div class="tabla__acciones">
                                        <a class="btn btn--primario btn--pequeno" th:if="${usuario.desactivable}" th:href="|#modal-desactivar-usuario-${usuario.id}|" aria-label="Desactivar usuario">
                                            Desactivar
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <tr th:replace="~{fragments/admin/componentes :: vacio(${usuarios}, 5, 'No hay registros disponibles.')}"></tr>
                        </tbody>
                    </table>
                </div>

                <nav th:replace="~{fragments/admin/componentes :: paginacion('Paginación')}"></nav>
            </section>

            <div th:each="usuario : ${usuarios}" th:if="${usuario.desactivable}" th:id="|modal-desactivar-usuario-${usuario.id}|" class="modal-overlay">
                <div class="modal modal--alerta">
                    <!-- th:action permite incluir el token CSRF en este envío. -->
                    <form th:action="@{/admin/usuarios/desactivar}" method="POST">
                        <input type="hidden" name="idUsuario" th:value="${usuario.id}">

                        <div th:replace="~{fragments/admin/componentes :: contenidoConfirmacion(|¿Deseas desactivar a @${usuario.username}?|, null, 'La cuenta quedará inactiva y sus datos se conservarán.')}"></div>

                        <div class="modal-alerta__acciones">
                            <a href="#" class="btn btn--cancelar">Cancelar</a>
                            <button type="submit" class="btn btn--peligro">Desactivar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

    </body>
</html>
