<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/admin :: layout('Categorías', 'categorias', ~{::main})}">
    <body>

        <main class="contenido-admin">
            <th:block th:replace="~{fragments/admin/componentes :: mensajes}"></th:block>
            <div class="encabezado-pagina">
                <div th:replace="~{fragments/admin/componentes :: titulo('Categorías', 'Organiza y mantiene la taxonomía del catálogo.', null)}"></div>
                <a class="btn btn--primario" href="#modal-nueva-categoria">
                    <i class="bi bi-plus-circle btn__icono" aria-hidden="true"></i>
                    Nueva categoría
                </a>
            </div>

            <section class="tabla-tarjeta">
                <div class="tabla-herramientas">
                    <form th:action="@{/admin/categorias}" method="get">
                        <label class="buscador">
                            <i class="bi bi-search buscador__icono" aria-hidden="true"></i>
                            <input class="buscador__campo" type="search" name="buscar" th:value="${buscar}"
                                   placeholder="Buscar por nombre..." aria-label="Buscar categorías">
                        </label>
                    </form>
                </div>

                <div class="tabla-scroll">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th scope="col">NOMBRE</th>
                                <th scope="col">DESCRIPCIÓN</th>
                                <th scope="col">LUGARES ASIGNADOS</th>
                                <th scope="col">ACCIÓN</th>
                            </tr>
                        </thead>
                        <!-- Thymeleaf genera una fila por cada registro recibido desde Java. -->
                        <tbody>

                            <tr th:each="categoria : ${categorias}">
                                <td th:text="${categoria.nombre}"></td>
                                <td th:text="${categoria.descripcion}"></td>
                                <td th:text="|${categoria.totalLugares} lugares|"></td>
                                <td>
                                    <div class="tabla__acciones">
                                        <a class="tabla__accion" th:href="|#modal-editar-categoria-${categoria.id}|" aria-label="Editar categoría">
                                            <i class="bi bi-pencil-fill tabla__icono" aria-hidden="true"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <tr th:replace="~{fragments/admin/componentes :: vacio(${categorias}, 4, 'No hay registros disponibles.')}"></tr>
                        </tbody>
                    </table>
                </div>

                <nav th:replace="~{fragments/admin/componentes :: paginacion('Paginación')}"></nav>
            </section>

            <div id="modal-nueva-categoria" class="modal-overlay">
                <div class="modal">
                    <div th:replace="~{fragments/admin/componentes :: cabeceraModal('AÑADIR NUEVA CATEGORÍA', 'Define una nueva categoria para clasificar los lugares.')}"></div>

                    <form th:action="@{/admin/categorias/guardar}" method="POST" class="modal__body">

                        <th:block th:replace="~{fragments/admin/formularios :: camposCategorias(null, 'categoria-nuevo')}"></th:block>

                        <div th:replace="~{fragments/admin/componentes :: guardar}"></div>
                    </form>
                </div>
            </div>

            <!-- Cada registro tiene su propia ventana, identificada por su ID. -->
            <div th:each="categoria : ${categorias}" th:id="|modal-editar-categoria-${categoria.id}|" class="modal-overlay">
                <div class="modal">
                    <div th:replace="~{fragments/admin/componentes :: cabeceraModal('EDITAR CATEGORIA', 'Modifica los datos actuales de la categoria.')}"></div>

                    <form th:action="@{/admin/categorias/actualizar}" method="POST" class="modal__body">
                        <input type="hidden" name="idCategoria" th:value="${categoria.id}">

                        <th:block th:replace="~{fragments/admin/formularios :: camposCategorias(${categoria}, |categoria-${categoria.id}|)}"></th:block>

                        <div th:replace="~{fragments/admin/componentes :: guardar}"></div>
                    </form>
                </div>
            </div>
        </main>

    </body>
</html>
