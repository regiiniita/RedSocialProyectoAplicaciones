<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/admin :: layout('Dashboard', 'dashboard', ~{::main})}">
    <body>

        <main class="contenido-admin">
            <span class="dashboard__subtitulo">Resumen General</span>
            <h1 class="dashboard__titulo">Dashboard de estadísticas</h1>

            <!-- Los totales se reciben desde el servicio de datos de prueba. -->
            <section class="metricas-grid">
                <div class="tarjeta-metrica">
                    <span class="tarjeta-metrica__etiqueta">Total lugares</span>
                    <strong class="tarjeta-metrica__valor" th:text="${resumen.totalLugares}"></strong>
                </div>
                <div class="tarjeta-metrica">
                    <span class="tarjeta-metrica__etiqueta">Reseñas este mes</span>
                    <strong class="tarjeta-metrica__valor" th:text="${resumen.resenasMes}"></strong>
                </div>
                <div class="tarjeta-metrica">
                    <span class="tarjeta-metrica__etiqueta">Usuarios activos</span>
                    <strong class="tarjeta-metrica__valor" th:text="${resumen.usuariosActivos}"></strong>
                </div>
                <div class="tarjeta-metrica">
                    <span class="tarjeta-metrica__etiqueta">Calificación promedio</span>
                    <strong class="tarjeta-metrica__valor" th:text="${resumen.calificacionPromedio}"></strong>
                </div>
            </section>

            <!-- Las listas y las barras se construyen con los datos del modelo. -->
            <section class="paneles-grid">
                <article class="panel-card">
                    <header class="panel-card__header">
                        <h2 class="panel-card__titulo">Lugares más reseñados</h2>
                        <span class="panel-card__subtitulo">Reseñas publicadas durante este mes</span>
                    </header>
                    <div class="lista-progreso">
                        <div class="fila-progreso" th:each="lugar : ${lugaresMasResenados}">
                            <span class="fila-progreso__nombre" th:text="${lugar.nombre}"></span>
                            <div class="barra-progreso">
                                <div class="barra-progreso__relleno" th:style="|width: ${lugar.porcentaje}%|"></div>
                            </div>
                            <span class="fila-progreso__total" th:text="${lugar.totalResenas}"></span>
                        </div>

                    </div>
                </article>

                <article class="panel-card">
                    <header class="panel-card__header">
                        <h2 class="panel-card__titulo">Usuarios más activos</h2>
                        <span class="panel-card__subtitulo">Actividad en los últimos 30 días</span>
                    </header>
                    <div class="lista-usuarios">
                        <div class="usuario-item" th:each="usr : ${usuariosMasActivos}">
                            <div class="usuario-item__perfil">
                                <img class="avatar avatar--sm" th:src="@{/img/avatar.svg}" alt="">
                                <div class="usuario-item__detalles">
                                    <span class="usuario-item__nombre" th:text="${usr.nombre}"></span>
                                    <span class="usuario-item__handle" th:text="${usr.handle}"></span>
                                </div>
                            </div>
                            <span class="usuario-item__conteo" th:text="|${usr.conteoResenas} reseñas|"></span>
                        </div>

                    </div>
                </article>
            </section>
        </main>

    </body>
</html>
