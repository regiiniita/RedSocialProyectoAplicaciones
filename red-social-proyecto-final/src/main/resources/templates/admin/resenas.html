<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('Moderación de reseñas', 'resenas', ~{::main})}">
<body>

<main class="contenido-admin">
    <div class="encabezado-pagina">
        <div th:replace="~{fragments/admin/componentes :: titulo('Moderación de Reseñas', 'Revisa y modera el contenido publicado por la comunidad.', null)}"></div>
    </div>

    <th:block th:replace="~{fragments/admin/componentes :: mensajes}"></th:block>
    <section class="tabla-tarjeta">
        <!-- La búsqueda se envía por GET para conservar el filtro en la dirección. -->
        <form class="tabla-herramientas" th:action="@{/admin/resenas}" method="get">
            <label class="buscador">
                <i class="bi bi-search buscador__icono" aria-hidden="true"></i>
                <input class="buscador__campo" type="search" name="buscar" th:value="${buscar}" placeholder="Buscar por usuario o lugar..." aria-label="Buscar reseñas">
            </label>
            <button class="btn btn--primario btn--pequeno" type="submit">Buscar</button>
            <a class="btn btn--cancelar btn--pequeno" th:href="@{/admin/resenas}">Limpiar</a>
        </form>

        <div class="tabla-scroll">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col">FECHA</th>
                    <th scope="col">USUARIO</th>
                    <th scope="col">LUGAR RESEÑADO</th>
                    <th scope="col">CALIFICACIÓN</th>
                    <th scope="col">ESTADO</th>
                    <th scope="col">ACCIÓN</th>
                </tr>
                </thead>
                <!-- Thymeleaf genera una fila por cada registro recibido desde Java. -->
                <tbody>

                <tr th:each="resena : ${resenas}">
                    <td th:text="${#temporals.format(resena.fecha, 'dd MMM yyyy')}"></td>
                    <td th:text="|@${resena.usuario.username}|"></td>
                    <td th:text="${resena.lugar.nombre}"></td>
                    <td>

                        <span th:replace="~{fragments/admin/componentes :: estrellas(${resena.calificacion}, true)}"></span>
                    </td>
                    <td th:text="${resena.estado}"></td>
                    <td>
                        <div class="tabla__acciones">

                            <a class="tabla__accion" th:href="|#modal-moderar-resena-${resena.id}|" aria-label="Moderar reseña">
                                <i class="bi bi-pencil-fill tabla__icono" aria-hidden="true"></i>
                            </a>
                        </div>
                    </td>
                </tr>

                <tr th:replace="~{fragments/admin/componentes :: vacio(${resenas}, 6, 'No hay registros disponibles.')}"></tr>
                </tbody>
            </table>
        </div>

        <nav th:replace="~{fragments/admin/componentes :: paginacion('Paginación')}"></nav>
    </section>
    <div th:each="resena : ${resenas}" th:id="|modal-moderar-resena-${resena.id}|" class="modal-overlay">
        <div class="modal modal--resena">

            <a href="#" class="modal__cerrar modal__cerrar--absoluto" aria-label="Cerrar modal">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </a>

            <div class="moderar-layout">
                <div class="moderar-izq">
                    <div class="moderar-header">
                        <div class="usuario-item__perfil">
                            <img class="avatar avatar--sm" th:src="@{/img/avatar.svg}" alt="Avatar">
                            <div class="usuario-item__detalles">
                                <span class="usuario-item__nombre" th:text="${resena.usuario.nombre}"></span>
                                <span class="usuario-item__handle" th:text="|@${resena.usuario.username}|"></span>
                            </div>
                        </div>

                        <a th:unless="${resena.oculta}" th:href="|#modal-confirmar-ocultar-${resena.id}|" class="btn btn--primario btn--pequeno">Ocultar</a>
                    </div>

                    <div class="moderar-foto-wrapper">
                        <img th:if="${resena.imagen != null}" th:src="@{${resena.imagen}}" alt="Fotografía de la reseña" class="moderar-foto">
                        <div class="moderar-fecha" th:text="${#temporals.format(resena.fecha, 'dd/MM/yyyy')}"></div>
                    </div>
                </div>

                <div class="moderar-der">
                    <div class="moderar-info-lugar">
                        <h3 class="moderar-lugar" th:text="${resena.lugar.nombre}"></h3>
                        <p class="moderar-categoria"><strong>Categoría:</strong> <span th:text="${resena.lugar.categoria.nombre}"></span></p>
                    </div>

                    <p class="moderar-texto" th:text="${resena.texto}"></p>

                    <div class="moderar-calificacion">
                        <span th:replace="~{fragments/admin/componentes :: estrellas(${resena.calificacion}, false)}"></span>
                        <span class="moderar-puntaje" th:text="${resena.calificacion}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:each="resena : ${resenas}" th:unless="${resena.oculta}" th:id="|modal-confirmar-ocultar-${resena.id}|" class="modal-overlay">
        <div class="modal modal--alerta">
            <!-- th:action permite incluir el token CSRF en este envío. -->
            <form th:action="@{/admin/resenas/ocultar}" method="POST">
                <input type="hidden" name="idResena" th:value="${resena.id}">

                <div th:replace="~{fragments/admin/componentes :: contenidoConfirmacion('¿Ocultar esta reseña?', 'Esta acción es permanente y no se podrá deshacer.', null)}"></div>

                <div class="modal-alerta__acciones">
                    <a th:href="|#modal-moderar-resena-${resena.id}|" class="btn btn--cancelar">Cancelar</a>
                    <button type="submit" class="btn btn--peligro">Ocultar</button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
