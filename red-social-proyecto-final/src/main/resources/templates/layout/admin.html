<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, activo, contenido)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|The Spot - ${titulo}|">The Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/variables.css}">
    <link rel="stylesheet" th:href="@{/styles/base.css}">
    <link rel="stylesheet" th:href="@{/styles/modal.css}">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body class="layout-admin">

<input type="checkbox" id="menu-admin" class="menu-toggle" aria-label="Abrir menú de navegación">

<header class="header-admin">
    <div class="header-admin__logo">
        <img th:src="@{/uploads/logo.png}" class="header-admin__logo--img" alt="TheSpot">
    </div>
    <div class="header-admin__usuario">
        <div class="header-admin__info">
            <div class="header-admin__info-nombre" th:text="${adminNombre} ?: 'Invitado'">loremIpsum</div>
            <div class="header-admin__info-rol">Panel Administrativo</div>
        </div>
        <img class="avatar avatar--sm" th:src="@{/img/avatar.svg}" alt="">
    </div>
    <label for="menu-admin" class="header-admin__hamburguesa" aria-hidden="true">
        <i class="bi bi-list"></i>
    </label>
</header>

<div class="cuerpo-admin">
    <aside class="sidebar">
        <nav class="sidebar__nav">
            <a th:href="@{/admin/dashboard}"
               class="sidebar__link"
               th:classappend="${activo == 'dashboard'} ? 'sidebar__link--activo'">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/admin/lugares}"
               class="sidebar__link"
               th:classappend="${activo == 'lugares'} ? 'sidebar__link--activo'">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
                </svg>
                <span>Gestión de lugares</span>
            </a>

            <a th:href="@{/admin/categorias}"
               class="sidebar__link"
               th:classappend="${activo == 'categorias'} ? 'sidebar__link--activo'">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
                <span>Categorías</span>
            </a>

            <a th:href="@{/admin/resenas}"
               class="sidebar__link"
               th:classappend="${activo == 'resenas'} ? 'sidebar__link--activo'">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span>Moderación de reseñas</span>
            </a>

            <a th:href="@{/admin/usuarios}"
               class="sidebar__link"
               th:classappend="${activo == 'usuarios'} ? 'sidebar__link--activo'">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span>Gestión de usuarios</span>
            </a>
        </nav>

        <div class="sidebar__footer">
            <a th:href="@{/logout}" class="sidebar__link">
                <svg class="sidebar__icono" viewBox="0 0 24 24">
                    <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                </svg>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main th:replace="${contenido}"></main>
</div>

</body>
</html>
