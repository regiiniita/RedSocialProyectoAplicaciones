spring.application.name=red-social-proyecto-final

# Las credenciales locales se mantienen fuera del repositorio.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thespot?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=itson
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.datos-prueba.habilitados=${CARGAR_DATOS_PRUEBA:true}
app.datos-prueba.admin-password=${ADMIN_PASSWORD:Admin123!}
app.datos-prueba.usuario-password=${USUARIO_PASSWORD:Usuario123!}
